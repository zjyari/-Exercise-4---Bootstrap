<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container m-3">	
    <div class="border"> All sides bordered </div>
    <div class="border border-0"> No border </div>
    <div class="border border-1 border-primary"> Thin primary border </div>
    <div class="border border-2 border-secondary"> Slightly thicker secondary border </div>
    <div class="border border-3 border-success"> Medium-thickness success border </div>
    <div class="border border-4 border-warning"> Thicker warning border </div> 
    <div class="border border-5 border-danger"> Very thick danger border </div>
    <div class="border rounded p-3">Rounded Corners</div>
    <div class="border rounded-circle border-success text-center">Rounded Corners</div>
    <button class="btn btn-primary rounded-pill">Rounded Pill Button</button>
</div>

</body>
</html>
