<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Nested Grid Exercise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">

  
  
  <div class="container">
    <p class="h-4 text-center mb-2 fw-bold">Grid 1</h1>
    <div class="row">
      <div class="col bg-success">Column 1</div>
      <div class="col bg-primary">Column 2</div>
      <div class="col bg-warning">Column 3</div>
    </div>
  </div>

  
    <div class="container">
      <p class="h-4 text-center mb-2 mt-5 fw-bold">Grid 2</h1>
      <div class="row">
        <div class="col-5 bg-success">Column 1</div>
        <div class="col-3 bg-primary">Column 2</div>
        <div class="col-4 bg-warning">Column 3</div>
      </div>
    </div>
    
    <div class="container my-5">
      <div class="row align-items-center">
        <div class="col-12 col-md-6 order-2 order-md-1">
          <h2>Kiki's Delivery Service</h2>
          <p>
            A young witch, Kiki, uses her flying ability to earn a living in a new town.
          </p>
        </div>
        <div class="col-12 col-md-6 order-1 order-md-2">
          <img src="assets/kiki.webp" class="img-fluid rounded" alt="Kiki's Delivery Service">
        </div>
      </div>
    </div>

    <!-- <div class="container">
      <p class="h-4 text-center mb-2 mt-5 fw-bold">Grid 3</h1>
      <div class="row">
        <div class="col-12 col-md-5 bg-success order-sm-2">Column 1</div>
        <div class="col-12 col-md-3 bg-primary order-1">Column 2</div>
        <div class="col-12 col-md-4 bg-warning order-3">Column 3</div>
      </div>
    </div> -->

    <div class="container">
      <p class="h-4 text-center mb-2 mt-5 fw-bold">Nested rows and columns</h1>
        <div class="row">
          <div class="col-6 bg-warning">
            Main Column
            <div class="row bg-primary">
              <div class="col-6 bg-primary text-white">Nested 1</div>
              <div class="col-6 bg-dark text-white">Nested 2</div>
            </div>
          </div>
          <div class="col-6 bg-success">Main Column 2</div>
        </div>
    </div>
    <br>
    
  

  </div>


</body>
</html>
