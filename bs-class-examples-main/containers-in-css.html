<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container - BS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .my-container {
        width: 100%;
        padding: 12px;
        margin: auto;
        background-color: bisque;
        border: 1px solid #dee2e6;
    }

    @media (min-width: 576px) {
    .my-container {
        max-width: 540px;
    }
    }

    @media (min-width: 768px) {
    .my-container {
        max-width: 720px;
    }
    }

    @media (min-width: 992px) {
    .my-container {
        max-width: 960px;
    }
    }

    @media (min-width: 1200px) {
    .my-container {
        max-width: 1140px;
    }
    }

    @media (min-width: 1400px) {
    .my-container {
        max-width: 1320px;
    }
    }
</style>
<body>
    
    <h2>Container create using BS</h2>
    <br>
    <div class="container-sm bg-info border border-warning p-3">
        <p>This is inside <code>.container-sm</code>. It becomes full-width below 576px.</p>
    </div>
    <br>

    <br>
    <br>
    <h2>"Container" created using CSS</h2>
    <div class="my-container">
        <p>This container is created using CSS only</p>
    </div>

</body>
</html>
