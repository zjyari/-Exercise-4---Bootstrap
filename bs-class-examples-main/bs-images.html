<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">  
</head>
<body>
    <div class="container">
    <img src="assets/arrietty.webp" class="img-fluid" alt="Responsive Image"></div>

    <br>
    <br>

    <h2 style="text-align: center;">Other Image Styles</h2>
    <p>1 - Rounded Image</p>
    <div class="container">
        <img src="assets/howlscastle.jpg" alt="How's Moving Castle" class="img-fluid d-block mx-auto rounded w-50">
    </div>

    <p>2 - Rounded Circle</p>
    <div class="container">
        <img src="assets/howlscastle.jpg" alt="How's Moving Castle" class="img-fluid d-block mx-auto rounded-circle w-50">
    </div>

    <p>3 - Thumbnail Image</p>
    <div class="container">
        <img src="assets/howlscastle.jpg" alt="How's Moving Castle" class="img-fluid d-block mx-auto img-thumbnail w-50">
    </div>
</body>
</html>
