<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS-Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-block bg-primary text-white p-2 mb-2">Block Element</div>
  <div class="d-inline bg-success text-white p-2 mb-2">Inline Element</div>
  <div class="d-inline-block bg-warning text-dark p-2 mb-2" style="width: 100px;">Inline Block Element</div>
  <div class="d-flex bg-info text-white p-2 mb-2">
    <div>Flex Child 1</div>
    <div>Flex Child 2</div>
  </div>
  <div class="d-none d-md-block bg-danger text-white p-2">
    Hidden on mobile, visible on desktop
</div>
<br><br>
<div class="d-flex bg-primary text-white p3 mb-3 ">
    <div class="d-flex">
        <div class="bg-danger my-2 ms-2">Item1</div>
        <div class="bg-warning my-2">Item2</div>
        <div class="bg-success my-2">Item3</div>
    </div>
</div>

<div class="d-inline-flex bg-secondary text-white p3 mb-3">
    <div class="d-flex">
        <div class="bg-info my-2">Item1</div>
        <div class="bg-light my-2 text-dark">Item2</div>
        <div class="bg-dark my-2 text-light">Item3</div>
    </div>
</div>

    
</body>
</html>
